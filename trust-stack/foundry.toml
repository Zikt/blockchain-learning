[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# The demo keeps addresses in deployments/ and reads sample sensor data from firmware/.
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./firmware" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
sepolia = "${SEPOLIA_RPC_URL}"
